<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>聚合对话 - 多模型同时回答</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11/styles/github-dark.min.css">
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11/lib/core.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11/lib/languages/javascript.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11/lib/languages/python.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11/lib/languages/bash.min.js"></script>
<style>
  :root {
    --bg: #f8f9fa;
    --card-bg: #ffffff;
    --text: #1a1a2e;
    --text-secondary: #6b7280;
    --border: #e5e7eb;
    --primary: #FF6B6B;
  }
  .dark { --bg: #121212; --card-bg: #1e1e2e; --text: #e0e0e0; --text-secondary: #9ca3af; --border: #333; }
  body { background: var(--bg); color: var(--text); transition: background 0.2s, color 0.2s; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
  .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; }
  .resize-handle { width: 6px; cursor: col-resize; background: transparent; transition: background 0.2s; flex-shrink: 0; }
  .resize-handle:hover, .resize-handle.active { background: var(--primary); }
  .typing::after { content: '▊'; animation: blink 1s infinite; }
  @keyframes blink { 0%,100% { opacity:1; } 50% { opacity:0; } }
  .model-content pre { background: #1e1e2e; border-radius: 8px; padding: 12px; overflow-x: auto; margin: 8px 0; }
  .model-content code { font-size: 13px; }
  .model-content p { margin: 4px 0; }
  .model-content ul, .model-content ol { margin: 4px 0; padding-left: 20px; }
  .model-content h1, .model-content h2, .model-content h3 { margin: 8px 0 4px; }
  .model-content blockquote { border-left: 3px solid var(--primary); padding-left: 12px; margin: 4px 0; opacity: 0.8; }
  .badge { display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: 11px; }
</style>
</head>
<body class="min-h-screen flex flex-col">
  <nav class="flex items-center justify-between px-4 md:px-6 py-3 border-b flex-shrink-0" style="background:var(--card-bg); border-color:var(--border);">
    <div class="flex items-center gap-3">
      <a href="/" class="text-lg font-bold no-underline" style="color:var(--primary);">🦐 虾SeekAI</a>
      <span class="text-sm hidden sm:inline" style="color:var(--text-secondary);">| 聚合对话</span>
    </div>
    <div class="flex items-center gap-2">
      <button id="themeToggle" class="text-xl cursor-pointer px-1">🌓</button>
      <button id="settingsBtn" class="px-3 py-1.5 rounded-lg text-sm border cursor-pointer" style="border-color:var(--border);">⚙️ 模型设置</button>
      <a href="/" class="px-3 py-1.5 rounded-lg text-sm border cursor-pointer no-underline" style="border-color:var(--border); color:var(--text);">← 返回导航</a>
    </div>
  </nav>

  <main class="flex-1 flex flex-col px-3 md:px-4 py-3 max-w-[1600px] mx-auto w-full min-h-0">
    <div class="flex-shrink-0 mb-3">
      <div class="flex gap-2 md:gap-3">
        <textarea id="userInput" rows="2" class="flex-1 p-3 rounded-xl resize-none text-base" style="background:var(--card-bg); border:1px solid var(--border); color:var(--text);"
          placeholder="输入你的问题，多个模型将同时回答...&#10;提示：按 Ctrl+Enter 发送"></textarea>
        <div class="flex flex-col gap-2 flex-shrink-0">
          <button id="sendBtn" onclick="sendMessage()" class="px-4 md:px-6 py-2 rounded-xl text-white font-semibold cursor-pointer text-sm md:text-base" style="background:var(--primary);">🚀 发送</button>
          <button id="clearBtn" onclick="clearAll()" class="px-4 md:px-6 py-2 rounded-xl text-sm border cursor-pointer" style="border-color:var(--border); color:var(--text-secondary);">清空</button>
        </div>
      </div>
    </div>

    <div id="cardsContainer" class="flex-1 flex gap-0 overflow-hidden min-h-0">
      <div class="flex-1 flex items-center justify-center" style="color:var(--text-secondary);">
        <p>正在加载模型列表...</p>
      </div>
    </div>
  </main>

  <!-- 模型设置弹窗 -->
  <div id="settingsModal" class="fixed inset-0 z-50 flex items-center justify-center hidden" style="background:rgba(0,0,0,0.5);">
    <div class="card p-6 rounded-2xl w-full max-w-xl max-h-[85vh] overflow-y-auto mx-4">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-lg font-bold">⚙️ 模型设置</h2>
        <button onclick="closeSettings()" class="text-xl cursor-pointer" style="color:var(--text-secondary);">&times;</button>
      </div>
      <p class="text-sm mb-3" style="color:var(--text-secondary);">勾选要使用的模型。未配置密钥的模型无法使用，请在下方添加。</p>
      <div id="modelChecklist" class="space-y-2 mb-4"></div>

      <!-- 添加自定义模型 -->
      <div id="addModelForm" class="border-t pt-4 hidden" style="border-color:var(--border);">
        <h3 class="text-sm font-semibold mb-3">➕ 添加自定义模型（OpenAI兼容）</h3>
        <div class="space-y-2">
          <input id="customName" class="w-full p-2 rounded-lg text-sm" style="background:var(--bg); border:1px solid var(--border); color:var(--text);" placeholder="模型名称，如：Kimi">
          <input id="customModel" class="w-full p-2 rounded-lg text-sm" style="background:var(--bg); border:1px solid var(--border); color:var(--text);" placeholder="Model ID，如：moonshot-v1-8k">
          <input id="customBaseURL" class="w-full p-2 rounded-lg text-sm" style="background:var(--bg); border:1px solid var(--border); color:var(--text);" placeholder="Base URL，如：https://api.moonshot.cn/v1">
          <input id="customApiKey" type="password" class="w-full p-2 rounded-lg text-sm" style="background:var(--bg); border:1px solid var(--border); color:var(--text);" placeholder="API Key">
          <input id="customIcon" class="w-full p-2 rounded-lg text-sm" style="background:var(--bg); border:1px solid var(--border); color:var(--text);" placeholder="图标 emoji，如：🌙（可选）" maxlength="3">
          <div class="flex gap-2">
            <button onclick="addCustomModel()" class="flex-1 px-4 py-2 rounded-lg text-white text-sm font-semibold cursor-pointer" style="background:var(--primary);">确认添加</button>
            <button onclick="toggleAddForm()" class="px-4 py-2 rounded-lg text-sm border cursor-pointer" style="border-color:var(--border);">取消</button>
          </div>
        </div>
      </div>

      <button id="showAddBtn" onclick="toggleAddForm()" class="w-full mt-3 px-4 py-2 rounded-lg text-sm border cursor-pointer" style="border-color:var(--border); color:var(--primary); font-weight:600;">➕ 添加自定义模型</button>
    </div>
  </div>

<script>
// ===== 状态管理 =====
const API_BASE = window.location.origin;
let availableModels = [];
let customModels = [];
let activeModels = [];
let panelWidths = {};
let isLoading = false;

// ===== 初始化 =====
async function init() {
  initTheme();
  loadCustomModels();
  loadModelKeys();
  await loadModels();
  loadActiveModels();
  loadPanelWidths();
  renderCards();
  setupKeyboardShortcut();
}

function loadCustomModels() {
  try {
    const saved = localStorage.getItem('xiaseek_custom_models');
    customModels = saved ? JSON.parse(saved) : [];
  } catch { customModels = []; }
}

function saveCustomModels() {
  localStorage.setItem('xiaseek_custom_models', JSON.stringify(customModels));
}


let modelKeys = {};
function loadModelKeys() {
  try { modelKeys = JSON.parse(localStorage.getItem('xiaseek_model_keys') || '{}'); } catch { modelKeys = {}; }
}
function saveModelKeys() {
  localStorage.setItem('xiaseek_model_keys', JSON.stringify(modelKeys));
}
function isModelUsable(m) {
  if (m.configured !== false) return true;
  if (modelKeys[m.id]) return true;
  return false;
}

async function loadModels() {
  try {
    const res = await fetch(`${API_BASE}/api/models`);
    const data = await res.json();
    // 合并内置模型和自定义模型
    availableModels = [
      ...(data.models || []),
      ...customModels
    ];
  } catch (err) {
    console.error('加载模型列表失败:', err);
    availableModels = [...customModels];
  }
}

function loadActiveModels() {
  const saved = localStorage.getItem('xiaseek_active_models');
  if (saved) {
    const savedIds = JSON.parse(saved);
    activeModels = savedIds.filter(id => availableModels.some(m => m.id === id));
  }
  // 默认只启用豆包和DeepSeek
  if (!activeModels.length) {
    activeModels = ['deepseek', 'doubao'].filter(id => availableModels.some(m => m.id === id));
  }
}

function saveActiveModels() {
  localStorage.setItem('xiaseek_active_models', JSON.stringify(activeModels));
}

function loadPanelWidths() {
  const saved = localStorage.getItem('xiaseek_panel_widths');
  panelWidths = saved ? JSON.parse(saved) : {};
}

function savePanelWidths() {
  localStorage.setItem('xiaseek_panel_widths', JSON.stringify(panelWidths));
}

// ===== 主题 =====
function initTheme() {
  const saved = localStorage.getItem('xiaseek_theme');
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  if (saved === 'dark' || (!saved && prefersDark)) {
    document.body.classList.add('dark');
  }
}

document.getElementById('themeToggle').addEventListener('click', () => {
  document.body.classList.toggle('dark');
  const isDark = document.body.classList.contains('dark');
  localStorage.setItem('xiaseek_theme', isDark ? 'dark' : 'light');
});

// ===== 渲染模型卡片（显示所有勾选的模型） =====
function renderCards() {
  const container = document.getElementById('cardsContainer');
  const models = activeModels
    .map(id => availableModels.find(m => m.id === id))
    .filter(Boolean);

  if (!models.length) {
    container.innerHTML = `<div class="flex-1 flex items-center justify-center" style="color:var(--text-secondary);">
      <div class="text-center"><p class="text-lg mb-2">🤖</p><p>暂无可用模型</p><p class="text-xs mt-1">请检查API密钥配置，或点击"模型设置"添加</p></div>
    </div>`;
    return;
  }

  const defaultWidth = 100 / models.length;

  let html = '';
  models.forEach((model, i) => {
    const width = panelWidths[model.id] || defaultWidth;
    html += `<div class="card flex flex-col overflow-hidden" style="width:${width}%; min-width:180px;" data-model="${model.id}">
      <div class="flex items-center gap-2 px-3 py-2 border-b flex-shrink-0" style="border-color:var(--border);">
        <span class="text-base">${model.icon || '🤖'}</span>
        <span class="text-sm font-semibold flex-1 truncate">${model.name}</span>
        <span class="text-xs flex-shrink-0" id="status-${model.id}" style="color:var(--text-secondary);">⏳</span>
      </div>
      <div class="flex-1 overflow-y-auto p-3 model-content text-sm" id="content-${model.id}">
        ${model.configured === false
          ? '<p class="text-sm" style="color:#f59e0b;">⚠️ 请先在设置中配置API密钥</p>'
          : '<p style="color:var(--text-secondary);">等待输入问题...</p>'}
      </div>
    </div>`;
    if (i < models.length - 1) {
      html += `<div class="resize-handle" onmousedown="startResize(event, ${i})"></div>`;
    }
  });

  container.innerHTML = html;
}

// ===== 面板缩放 =====
let resizeState = null;

function startResize(e, index) {
  e.preventDefault();
  const cards = document.querySelectorAll('#cardsContainer .card');
  if (cards.length < 2) return;
  resizeState = {
    index,
    startX: e.clientX,
    leftCard: cards[index],
    rightCard: cards[index + 1],
    leftStartWidth: cards[index].offsetWidth,
    rightStartWidth: cards[index + 1].offsetWidth
  };
  const handles = document.querySelectorAll('.resize-handle');
  if (handles[index]) handles[index].classList.add('active');
  document.body.style.cursor = 'col-resize';
  document.body.style.userSelect = 'none';
  document.addEventListener('mousemove', onResize);
  document.addEventListener('mouseup', stopResize);
}

function onResize(e) {
  if (!resizeState) return;
  const containerWidth = document.getElementById('cardsContainer').offsetWidth;
  const dx = e.clientX - resizeState.startX;
  const leftPct = ((resizeState.leftStartWidth + dx) / containerWidth) * 100;
  const rightPct = ((resizeState.rightStartWidth - dx) / containerWidth) * 100;
  if (leftPct > 10 && rightPct > 10) {
    resizeState.leftCard.style.width = leftPct + '%';
    resizeState.rightCard.style.width = rightPct + '%';
  }
}

function stopResize() {
  if (!resizeState) return;
  document.querySelectorAll('.resize-handle').forEach(h => h.classList.remove('active'));
  document.body.style.cursor = '';
  document.body.style.userSelect = '';
  document.removeEventListener('mousemove', onResize);
  document.removeEventListener('mouseup', stopResize);
  document.querySelectorAll('#cardsContainer .card').forEach(card => {
    const modelId = card.dataset.model;
    const width = parseFloat(card.style.width);
    if (!isNaN(width)) panelWidths[modelId] = width;
  });
  savePanelWidths();
  resizeState = null;
}

// ===== 发送消息 =====
async function sendMessage() {
  if (isLoading) return;
  const input = document.getElementById('userInput');
  const message = input.value.trim();
  if (!message) return;

  const allModels = activeModels
    .map(id => availableModels.find(m => m.id === id))
    .filter(Boolean);

  const configuredModels = allModels.filter(m => isModelUsable(m));
  const unconfiguredModels = allModels.filter(m => !isModelUsable(m));

  if (!configuredModels.length) return alert('没有已配置的模型，请在设置中配置API密钥');

  isLoading = true;
  const sendBtn = document.getElementById('sendBtn');
  sendBtn.disabled = true;
  sendBtn.textContent = '⏳';

  // 已配置模型：显示思考中
  configuredModels.forEach(m => {
    const el = document.getElementById(`content-${m.id}`);
    if (el) el.innerHTML = '<p class="typing" style="color:var(--text-secondary);">思考中...</p>';
    const st = document.getElementById(`status-${m.id}`);
    if (st) st.textContent = '💭';
  });

  // 未配置模型：直接显示提示
  unconfiguredModels.forEach(m => {
    const el = document.getElementById(`content-${m.id}`);
    if (el) el.innerHTML = '<p style="color:#f59e0b;">⚠️ 该模型未配置API密钥，请在设置中添加</p>';
    const st = document.getElementById(`status-${m.id}`);
    if (st) st.textContent = '⚠️';
  });

  const modelIds = configuredModels.map(m => m.id);
  const customConfigs = configuredModels
    .map(m => {
      const c = { id: m.id, name: m.name };
      const key = modelKeys[m.id] || m.apiKey;
      if (key) c.apiKey = key;
      if (m.baseURL) c.baseURL = m.baseURL;
      if (m.model) c.model = m.model;
      return c;
    })
    .filter(c => c.apiKey);

  try {
    const res = await fetch(`${API_BASE}/api/chat/stream`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message, modelIds, customModels: customConfigs, conversationHistory: [] })
    });

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    const modelContents = {};
    configuredModels.forEach(m => { modelContents[m.id] = ''; });
    let currentEvent = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop() || '';

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        if (line.startsWith('event: ')) {
          currentEvent = line.slice(7).trim();
        } else if (line.startsWith('data: ')) {
          const dataStr = line.slice(6);
          if (!currentEvent) continue;
          try {
            handleSSEEvent(currentEvent, JSON.parse(dataStr), modelContents);
          } catch {}
          currentEvent = '';
        }
      }
    }
  } catch (err) {
    console.error('请求失败:', err);
    activeModels.forEach(id => {
      const el = document.getElementById(`content-${id}`);
      if (el) el.innerHTML = `<p style="color:#ef4444;">❌ 连接失败: ${escapeHtml(err.message)}</p>`;
      const st = document.getElementById(`status-${id}`);
      if (st) st.textContent = '❌';
    });
  } finally {
    isLoading = false;
    document.getElementById('sendBtn').disabled = false;
    document.getElementById('sendBtn').textContent = '🚀 发送';
  }
}

function handleSSEEvent(event, data, modelContents) {
  const modelId = data.modelId;
  if (!modelId) return;

  if (event === 'chunk') {
    modelContents[modelId] = (modelContents[modelId] || '') + data.content;
    updateCardContent(modelId, modelContents[modelId], false);
    const st = document.getElementById(`status-${modelId}`);
    if (st) st.textContent = '💬';
  } else if (event === 'complete') {
    modelContents[modelId] = data.content || modelContents[modelId];
    updateCardContent(modelId, modelContents[modelId], true);
    const st = document.getElementById(`status-${modelId}`);
    if (st) st.textContent = '✅';
  } else if (event === 'error') {
    const el = document.getElementById(`content-${modelId}`);
    if (el) el.innerHTML = `<p style="color:#ef4444;">❌ ${escapeHtml(data.error)}</p>`;
    const st = document.getElementById(`status-${modelId}`);
    if (st) st.textContent = '❌';
  }
}

function updateCardContent(modelId, content, isComplete) {
  const el = document.getElementById(`content-${modelId}`);
  if (!el) return;
  const html = marked.parse(content);
  el.innerHTML = html + (isComplete ? '' : '<span class="typing"></span>');
  el.scrollTop = el.scrollHeight;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ===== 清空 =====
function clearAll() {
  document.getElementById('userInput').value = '';
  activeModels.forEach(id => {
    const el = document.getElementById(`content-${id}`);
    if (el) el.innerHTML = '<p style="color:var(--text-secondary);">等待输入问题...</p>';
    const st = document.getElementById(`status-${id}`);
    if (st) st.textContent = '⏳';
  });
}

// ===== 设置面板 =====
document.getElementById('settingsBtn').addEventListener('click', openSettings);

function openSettings() {
  const list = document.getElementById('modelChecklist');
  const builtinModels = availableModels.filter(m => m.builtin);
  const userCustomModels = availableModels.filter(m => !m.builtin);

  function modelRow(m) {
    const isChecked = activeModels.includes(m.id);
    const hasEnvKey = m.configured !== false;
    const userKey = modelKeys[m.id] || '';
    const ph = hasEnvKey ? '已配置(环境变量)' : '在此输入API Key';
    return `
    <div class="flex items-center gap-2 p-2.5 rounded-lg" style="background:var(--bg);">
      <input type="checkbox" ${isChecked ? 'checked' : ''}
        onchange="toggleModel('${m.id}', this.checked)" class="w-4 h-4 flex-shrink-0">
      <span class="text-lg flex-shrink-0">${m.icon || '🤖'}</span>
      <span class="text-sm font-medium flex-shrink-0" style="width:70px;">${m.name}</span>
      <input type="password" value="${escapeAttr(userKey)}"
        placeholder="${ph}" id="keyinput-${m.id}"
        class="flex-1 p-1.5 rounded text-xs"
        style="background:var(--card-bg); border:1px solid var(--border); color:var(--text); min-width:0;">
      <button onclick="saveModelKey('${m.id}')" id="savebtn-${m.id}"
        class="px-2 py-1 rounded text-xs font-semibold flex-shrink-0 cursor-pointer border"
        style="background:var(--primary); color:#fff; border-color:var(--primary);">保存</button>
    </div>`;
  }
  }

  list.innerHTML = builtinModels.map(modelRow).join('')
    + (userCustomModels.length ? '<div class="text-xs mt-3 mb-2" style="color:var(--text-secondary);">自定义模型</div>' : '')
    + userCustomModels.map(m => {
      const isChecked = activeModels.includes(m.id);
      const userKey = modelKeys[m.id] || m.apiKey || '';
      return `
      <div class="flex items-center gap-2 p-2.5 rounded-lg" style="background:var(--bg);">
        <input type="checkbox" ${isChecked ? 'checked' : ''}
          onchange="toggleModel('${m.id}', this.checked)" class="w-4 h-4 flex-shrink-0">
        <span class="text-lg flex-shrink-0">${m.icon || '🤖'}</span>
        <span class="text-sm font-medium flex-shrink-0" style="width:70px;">${m.name}</span>
        <input type="password" value="${escapeAttr(userKey)}"
          placeholder="API Key" id="keyinput-${m.id}"
          class="flex-1 p-1.5 rounded text-xs"
          style="background:var(--card-bg); border:1px solid var(--border); color:var(--text); min-width:0;">
        <button onclick="saveModelKey('${m.id}')" id="savebtn-${m.id}"
          class="px-2 py-1 rounded text-xs font-semibold flex-shrink-0 cursor-pointer border"
          style="background:var(--primary); color:#fff; border-color:var(--primary);">保存</button>
        <button onclick="event.preventDefault(); removeCustomModel('${m.id}')" class="text-xs cursor-pointer flex-shrink-0" style="color:#ef4444;" title="删除">✕</button>
      </div>`;
    }).join('');

  document.getElementById('showAddBtn').style.display = 'block';
  document.getElementById('addModelForm').classList.add('hidden');
  document.getElementById('settingsModal').classList.remove('hidden');
}

function closeSettings() {
  document.getElementById('settingsModal').classList.add('hidden');
}

function saveModelKey(modelId) {
  const input = document.getElementById('keyinput-' + modelId);
  const btn = document.getElementById('savebtn-' + modelId);
  if (!input || !btn) return;
  const value = input.value.trim();
  if (value) {
    modelKeys[modelId] = value;
  } else {
    delete modelKeys[modelId];
  }
  saveModelKeys();
  btn.textContent = '✓ 已保存';
  btn.style.background = '#22c55e';
  btn.style.borderColor = '#22c55e';
  setTimeout(() => {
    btn.textContent = '保存';
    btn.style.background = 'var(--primary)';
    btn.style.borderColor = 'var(--primary)';
  }, 1500);
  // Refresh cards to pick up the new key
  loadActiveModels();
  renderCards();
}

function escapeAttr(str) {
  return str.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function toggleModel(modelId, checked) {
  if (checked) {
    if (!activeModels.includes(modelId)) activeModels.push(modelId);
  } else {
    activeModels = activeModels.filter(id => id !== modelId);
  }
  saveActiveModels();
  renderCards();
}

// ===== 自定义模型管理 =====
function toggleAddForm() {
  const form = document.getElementById('addModelForm');
  const btn = document.getElementById('showAddBtn');
  if (form.classList.contains('hidden')) {
    form.classList.remove('hidden');
    btn.style.display = 'none';
    // 清空表单
    ['customName','customModel','customBaseURL','customApiKey','customIcon'].forEach(id => {
      document.getElementById(id).value = '';
    });
  } else {
    form.classList.add('hidden');
    btn.style.display = 'block';
  }
}

function addCustomModel() {
  const name = document.getElementById('customName').value.trim();
  const model = document.getElementById('customModel').value.trim();
  const baseURL = document.getElementById('customBaseURL').value.trim();
  const apiKey = document.getElementById('customApiKey').value.trim();
  const icon = document.getElementById('customIcon').value.trim() || '🤖';

  if (!name || !model || !baseURL || !apiKey) {
    return alert('请填写所有必填字段（名称、Model ID、Base URL、API Key）');
  }

  const id = 'custom_' + Date.now();
  const customModel = {
    id, name, model, baseURL, apiKey, icon,
    provider: 'openai',
    builtin: false,
    configured: true
  };

  customModels.push(customModel);
  saveCustomModels();

  // 重新加载模型列表
  availableModels = [...availableModels.filter(m => m.builtin), ...customModels];
  activeModels.push(id);
  saveActiveModels();

  toggleAddForm();
  openSettings(); // 刷新设置面板
  renderCards();
}

function removeCustomModel(id) {
  if (!confirm('确定删除此自定义模型？')) return;
  customModels = customModels.filter(m => m.id !== id);
  saveCustomModels();
  activeModels = activeModels.filter(mid => mid !== id);
  saveActiveModels();
  availableModels = availableModels.filter(m => m.builtin || m.id !== id);
  openSettings(); // 刷新设置面板
  renderCards();
}

document.getElementById('settingsModal').addEventListener('click', function(e) {
  if (e.target === this) closeSettings();
});

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeSettings();
});

// ===== 键盘快捷键 =====
function setupKeyboardShortcut() {
  document.getElementById('userInput').addEventListener('keydown', function(e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
      e.preventDefault();
      sendMessage();
    }
  });
}

init();
</script>
