<style>
:root {
  --primary: #FF6B6B;
  --primary-light: #FF8E8E;
  --primary-dark: #E55A5A;
  --bg: #F8F9FA;
  --card-bg: #FFFFFF;
  --text: #1A1A2E;
  --text-secondary: #6B7280;
  --border: #E5E7EB;
  --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
  --shadow-hover: 0 10px 25px rgba(0,0,0,0.1), 0 4px 10px rgba(0,0,0,0.05);
  --nav-bg: #FFFFFF;
  --tag-bg: #F3F4F6;
  --tag-text: #374151;
  --radius: 16px;
  --transition: 0.2s ease;
}
[data-theme="dark"] {
  --bg: #121212;
  --card-bg: #1E1E2E;
  --text: #E0E0E0;
  --text-secondary: #9CA3AF;
  --border: #333;
  --shadow: 0 1px 3px rgba(0,0,0,0.3);
  --shadow-hover: 0 10px 25px rgba(0,0,0,0.5);
  --nav-bg: #1A1A2E;
  --tag-bg: #2A2A3E;
  --tag-text: #D1D5DB;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  transition: background var(--transition), color var(--transition);
}

/* ===== TOP NAV ===== */
.topnav {
  position: fixed; top:0; left:0; right:0; z-index:1000;
  background: var(--nav-bg);
  border-bottom: 1px solid var(--border);
  backdrop-filter: blur(10px);
  padding: 0 24px;
  display: flex; align-items: center;
  height: 64px;
  gap: 12px;
  transition: background var(--transition), border var(--transition);
}
.logo {
  display: flex; align-items: center; gap: 8px;
  font-size: 18px; font-weight: 800;
  white-space: nowrap;
  color: var(--primary);
  user-select: none;
}
.logo-img { height: 28px; width: auto; vertical-align: middle; }
.nav-tabs {
  display: flex; align-items: center; gap: 4px;
  flex: 1; overflow-x: auto;
  scrollbar-width: none;
  -ms-overflow-style: none;
}
.nav-tabs::-webkit-scrollbar { display:none; }
.nav-tab {
  padding: 6px 14px;
  border-radius: 8px;
  font-size: 13px; font-weight: 600;
  white-space: nowrap;
  cursor: pointer;
  border: 1px solid transparent;
  background: transparent;
  color: var(--text-secondary);
  transition: all var(--transition);
  user-select: none;
}
.nav-tab:hover { background: var(--tag-bg); color: var(--text); }
.nav-tab.active { background: var(--primary); color: #fff; border-color: var(--primary); }
.nav-tab.drag-over { border-color: var(--primary); border-style: dashed; }
.nav-tab.dragging { opacity: 0.5; }
.nav-right {
  display: flex; align-items: center; gap: 8px;
}
.search-wrap {
  position: relative;
  display: flex; align-items: center;
}
.search-input {
  width: 200px; height: 38px;
  padding: 0 36px 0 14px;
  border: 1px solid var(--border);
  border-radius: 19px;
  font-size: 13px;
  background: var(--bg);
  color: var(--text);
  outline: none;
  transition: all var(--transition);
}
.search-input:focus { width: 260px; border-color: var(--primary); }
.search-icon {
  position: absolute; right: 10px;
  font-size: 16px; cursor: pointer;
  background: none; border: none;
}
.theme-btn {
  width: 38px; height: 38px; border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--card-bg);
  cursor: pointer;
  font-size: 18px;
  display: flex; align-items: center; justify-content: center;
  transition: all var(--transition);
}
.theme-btn:hover { border-color: var(--primary); }

/* ===== MAIN CONTENT ===== */
.main { margin-top: 64px; padding: 24px; max-width: 1400px; margin-left: auto; margin-right: auto; }
.module-header {
  position: relative; text-align: center; margin-bottom: 28px;
  padding: 20px 0;
  overflow: hidden;
}
.module-header::before,
.module-header::after {
  content: ''; position: absolute; top: 0; bottom: 0;
  width: 180px;
  background-repeat: no-repeat;
  background-size: contain;
  background-position: center;
  pointer-events: none;
  z-index: 0;
}
.module-header::before {
  left: 0;
  background-image: url('left.png');
  mask-image: linear-gradient(to right, black 0%, black 60%, transparent 100%);
  -webkit-mask-image: linear-gradient(to right, black 0%, black 60%, transparent 100%);
}
.module-header::after {
  right: 0;
  background-image: url('right.png');
  mask-image: linear-gradient(to left, black 0%, black 60%, transparent 100%);
  -webkit-mask-image: linear-gradient(to left, black 0%, black 60%, transparent 100%);
}
.module-title {
  font-size: 28px; font-weight: 800;
  background: linear-gradient(135deg, var(--primary), var(--primary-light));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  position: relative; z-index: 1;
}
.module-desc { color: var(--text-secondary); font-size: 14px; margin-top: 6px; position: relative; z-index: 1; }

/* Category filter pills */
.cat-filters {
  display: flex; flex-wrap: wrap; gap: 8px;
  justify-content: center; margin-bottom: 24px;
}
.cat-pill {
  padding: 6px 16px; border-radius: 20px;
  font-size: 13px; font-weight: 500;
  cursor: pointer; border: 1px solid var(--border);
  background: var(--card-bg); color: var(--text-secondary);
  transition: all var(--transition);
  user-select: none;
}
.cat-pill:hover { border-color: var(--primary); color: var(--primary); }
.cat-pill.active { background: var(--primary); color: #fff; border-color: var(--primary); }

/* Card Grid */
.card-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
}
.card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  cursor: pointer;
  transition: all var(--transition);
  position: relative;
  overflow: hidden;
}
.card:hover {
  transform: translateY(-4px);
  box-shadow: var(--shadow-hover);
  border-color: var(--primary);
}
.card-icon { font-size: 32px; margin-bottom: 10px; display:block; }
.card-name { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
.card-desc {
  font-size: 13px; color: var(--text-secondary);
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden; line-height: 1.5;
}
.card-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 10px; }
.card-tag {
  font-size: 11px; padding: 2px 8px; border-radius: 10px;
  background: var(--tag-bg); color: var(--tag-text);
}
.card-tag.rank {
  background: var(--primary); color: #fff; font-weight: 700;
}
.card-meta { display: flex; gap: 16px; margin-top: 8px; font-size: 12px; color: var(--text-secondary); }
.card-copy-btn {
  margin-top: 10px;
  padding: 6px 16px;
  border-radius: 8px;
  border: 1px solid var(--primary);
  background: transparent;
  color: var(--primary);
  font-size: 12px; font-weight: 600;
  cursor: pointer;
  transition: all var(--transition);
  width: 100%;
}
.card-copy-btn:hover { background: var(--primary); color: #fff; }
.card-copy-btn.copied { background: #10B981; border-color: #10B981; color: #fff; }
.empty-state { text-align:center; padding:60px 20px; color:var(--text-secondary); }

/* ===== FOOTER ===== */
.footer {
  text-align: center; padding: 24px;
  color: var(--text-secondary); font-size: 12px;
  border-top: 1px solid var(--border);
}

/* ===== MODAL ===== */
.modal-overlay {
  display: none; position: fixed; inset:0; z-index:2000;
  background: rgba(0,0,0,0.5);
  align-items: center; justify-content: center;
}
.modal-overlay.show { display: flex; }
.modal {
  background: var(--card-bg); border-radius: var(--radius);
  padding: 28px; width: 90%; max-width: 480px;
  box-shadow: var(--shadow-hover);
}
.modal h3 { margin-bottom: 16px; font-size: 18px; }
.modal label { display:block; font-size:13px; font-weight:600; margin:10px 0 4px; color: var(--text-secondary); }
.modal input, .modal select, .modal textarea {
  width: 100%; padding: 10px 12px; border: 1px solid var(--border);
  border-radius: 8px; font-size: 14px; background: var(--bg); color: var(--text);
  outline: none; font-family: inherit;
}
.modal input:focus, .modal select:focus, .modal textarea:focus { border-color: var(--primary); }
.modal textarea { resize: vertical; min-height: 80px; }
.modal-actions { display: flex; gap: 8px; margin-top: 16px; justify-content: flex-end; }
.btn {
  padding: 8px 20px; border-radius: 8px; font-size: 14px; font-weight: 600;
  cursor: pointer; border: none; transition: all var(--transition);
}
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-dark); }
.btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }
.btn-ghost:hover { border-color: var(--primary); color: var(--primary); }

/* Add tool float btn */
.add-float {
  position: fixed; bottom: 28px; right: 28px; z-index: 999;
  width: 52px; height: 52px; border-radius: 50%;
  background: var(--primary); color: #fff; font-size: 28px;
  border: none; cursor: pointer; box-shadow: 0 4px 16px rgba(255,107,107,0.4);
  transition: all var(--transition);
  display: flex; align-items: center; justify-content: center;
}
.add-float:hover { transform: scale(1.1); }

/* ===== RESPONSIVE ===== */
@media (max-width: 1200px) { .card-grid { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 768px) {
  .card-grid { grid-template-columns: repeat(2, 1fr); }
  .topnav { padding: 0 12px; gap: 8px; }
  .nav-tab { font-size: 11px; padding: 5px 10px; }
  .search-input { width: 120px; }
  .search-input:focus { width: 160px; }
  .main { padding: 16px; }
  .logo { font-size: 15px; }
}
@media (max-width: 480px) {
  .card-grid { grid-template-columns: 1fr; }
  .nav-right { gap: 4px; }
  .search-input { width: 100px; font-size:12px; }
  .search-input:focus { width: 130px; }
}

/* Toast */
.toast {
  position: fixed; top: 80px; left: 50%; transform: translateX(-50%);
  background: #10B981; color: #fff; padding: 10px 24px; border-radius: 20px;
  font-size: 14px; font-weight: 600; z-index: 3000;
  opacity: 0; transition: opacity 0.3s;
  pointer-events: none;
}
.toast.show { opacity: 1; }

/* Sort handle */
.nav-tab .drag-handle { margin-right: 4px; font-size: 10px; opacity: 0.4; }
</style>
</head>

// ==================== STATE ====================
const STORAGE_KEY_MODULES = 'xiaseek_module_order';
const STORAGE_KEY_THEME = 'xiaseek_theme';
const STORAGE_KEY_TOOLS = 'xiaseek_user_tools';

let moduleOrder = JSON.parse(localStorage.getItem(STORAGE_KEY_MODULES)) || MODULES.map(m=>m.id);
let activeModuleId = moduleOrder[0];
let activeCatFilter = '全部';
let searchQuery = '';
let userTools = JSON.parse(localStorage.getItem(STORAGE_KEY_TOOLS)) || {};

// Ensure all module IDs exist in userTools
MODULES.forEach(m => { if (!userTools[m.id]) userTools[m.id] = []; });

function getModuleData(modId) {
  const maps = { ai:dataAI, env:dataEnv, plugin:dataPlugin, skill:dataSkill, rank:dataRank, proxy:dataProxy, token:dataToken, hardware:dataHardware };
  const base = maps[modId] || [];
  const extra = userTools[modId] || [];
  return [...base, ...extra];
}

function getModuleConfig(modId) {
  return MODULES.find(m=>m.id===modId) || MODULES[0];
}

// ==================== RENDER ====================
function getOrderedModules() {
  return moduleOrder.map(id => MODULES.find(m=>m.id===id)).filter(Boolean);
}

function getCatOptions(modId, data) {
  const cfg = getModuleConfig(modId);
  const field = cfg.filterBy;
  if (!field) return [];
  const vals = new Set();
  data.forEach(item => {
    const v = item[field];
    if (Array.isArray(v)) v.forEach(t=>vals.add(t));
    else if (v) vals.add(v);
  });
  return ['全部', ...Array.from(vals)];
}

function filterData(modId, data) {
  const cfg = getModuleConfig(modId);
  let filtered = data;

  // Category filter
  if (activeCatFilter !== '全部') {
    const field = cfg.filterBy;
    filtered = filtered.filter(item => {
      const v = item[field];
      if (Array.isArray(v)) return v.includes(activeCatFilter);
      return v === activeCatFilter;
    });
  }

  // Search filter
  if (searchQuery.trim()) {
    const q = searchQuery.trim().toLowerCase();
    const fields = cfg.searchFields || ['name','desc'];
    // Also search in tags
    filtered = filtered.filter(item => {
      return fields.some(f => {
        const v = item[f];
        if (Array.isArray(v)) return v.some(t => String(t).toLowerCase().includes(q));
        return v && String(v).toLowerCase().includes(q);
      });
    });
  }

  return filtered;
}

  const tagHtml = tags.slice(0,3).map(t=>`<span class="card-tag">${t}</span>`).join('');

    // Skill market card with copy
    const shortPrompt = item.prompt ? item.prompt.substring(0,80)+'...' : '';
    return `
      <div class="card" data-url="${item.url||''}" data-name="${item.name}" onclick="event.stopPropagation();">
        <span class="card-icon">${item.icon||'🔧'}</span>
        <div class="card-name">${item.name}</div>
        <div class="card-desc">${item.desc}</div>
        <div style="font-size:11px;color:var(--text-secondary);margin-top:6px;font-family:monospace;background:var(--tag-bg);padding:4px 8px;border-radius:6px;">${escapeHtml(shortPrompt)}</div>

      <div class="card" data-url="${item.url||''}" data-name="${item.name}" onclick="openCardLink(event, '${item.url||''}')">
        <span class="card-icon">${item.icon||'🔧'}</span>
        <div class="card-name">${item.name}</div>
        <div class="card-desc">${item.desc}</div>
        <div class="card-tags">${tagHtml}</div>
        <div class="card-meta">
          <span>🖥️ ${item.system||''}</span>
          <span>📊 ${item.difficulty||''}</span>
        </div>
      </div>`;
  }

  if (modId === 'plugin') {
    return `
      <div class="card" data-url="${item.url||''}" data-name="${item.name}" onclick="openCardLink(event, '${item.url||''}')">
        <span class="card-icon">${item.icon||'🔧'}</span>
        <div class="card-name">${item.name}</div>
        <div class="card-desc">${item.desc}</div>
        <div class="card-tags">${tagHtml}</div>
        <div class="card-meta">
          <span>📌 ${item.platform||''}</span>
          <span>🎯 ${item.feature||''}</span>
        </div>
      </div>`;
  }

  if (modId === 'proxy') {
    return `
      <div class="card" data-url="${item.url||''}" data-name="${item.name}" onclick="openCardLink(event, '${item.url||''}')">
        <span class="card-icon">${item.icon||'🔧'}</span>
        <div class="card-name">${item.name}</div>
        <div class="card-desc">${item.desc}</div>
        <div class="card-tags">${tagHtml}</div>
        <div class="card-meta">
          <span>🔄 ${item.models||''}</span>
          <span>⚡ ${item.latency||''}</span>
          <span>🛡️ ${item.stability||''}</span>
        </div>
      </div>`;
  }

  if (modId === 'token') {
    return `
      <div class="card" data-url="${item.url||''}" data-name="${item.name}" onclick="openCardLink(event, '${item.url||''}')">
        <span class="card-icon">${item.icon||'🔧'}</span>
        <div class="card-name">${item.name}</div>
        <div class="card-desc">${item.desc}</div>
        <div class="card-tags">${tagHtml}</div>
        <div class="card-meta">
          <span>💰 ${item.price||''}</span>
          <span>🔒 安全：${item.security||''}</span>
        </div>
      </div>`;
  }

  if (modId === 'hardware') {
    return `
      <div class="card" data-url="${item.url||''}" data-name="${item.name}" onclick="openCardLink(event, '${item.url||''}')">
        <span class="card-icon">${item.icon||'🔧'}</span>
        <div class="card-name">${item.name}</div>
        <div class="card-desc">${item.desc}</div>
        <div class="card-tags">${tagHtml}</div>
        <div class="card-meta">
          <span>💾 ${item.vram||''}</span>
          <span>💵 ${item.price||''}</span>
          <span>${item.recommend||''}</span>
        </div>
      </div>`;
  }

  // Default card (ai, etc.)
  return `
    <div class="card" data-url="${item.url||''}" data-name="${item.name}" onclick="openCardLink(event, '${item.url||''}')">
      <span class="card-icon">${item.icon||'🔧'}</span>
      <div class="card-name">${item.name}</div>
      <div class="card-desc">${item.desc}</div>
      <div class="card-tags">${tagHtml}</div>
    </div>`;
}

function renderModule(modId) {
  const cfg = getModuleConfig(modId);
  const data = getModuleData(modId);
  const filtered = filterData(modId, data);
  const cats = getCatOptions(modId, data);

  let catHtml = '';
  if (cats.length > 1) {
    catHtml = `<div class="cat-filters">${cats.map(c =>
      `<span class="cat-pill${c===activeCatFilter?' active':''}" onclick="setCatFilter('${escapeHtml(c)}')">${c}</span>`
    ).join('')}</div>`;
  }

  const cardsHtml = filtered.length > 0
    ? `<div class="card-grid">${filtered.map((item,i)=>renderCard(modId,item,i)).join('')}</div>`
    : `<div class="empty-state">
        <div style="font-size:48px;margin-bottom:12px;">🔍</div>
        <p>没有找到匹配的内容</p>
        <p style="font-size:13px;margin-top:4px;">试试更换搜索词或分类筛选，或点击右下角 + 添加</p>
      </div>`;

  return `
    <div class="module-header">
      <div class="module-title">${cfg.name}</div>
      <div class="module-desc">${cfg.desc} · 共 ${filtered.length} 个</div>
    </div>
    ${catHtml}
    ${cardsHtml}`;
}

function renderNav() {
  const ordered = getOrderedModules();
  const container = document.getElementById('navTabs');
  container.innerHTML = ordered.map((m,i) => `
    <span class="nav-tab${m.id===activeModuleId?' active':''}"
          draggable="true"
          data-module-id="${m.id}"
          data-index="${i}"
          onclick="switchModule('${m.id}')"
          ondragstart="handleDragStart(event)"
          ondragover="handleDragOver(event)"
          ondragleave="handleDragLeave(event)"
          ondrop="handleDrop(event)"
          ondragend="handleDragEnd(event)">
      <span class="drag-handle">⠿</span>${m.name}
    </span>
  `).join('');
}

function switchModule(modId) {
  activeModuleId = modId;
  activeCatFilter = '全部';
  searchQuery = document.getElementById('searchInput').value;
  renderNav();
  document.getElementById('mainContent').innerHTML = renderModule(modId);
  window.scrollTo({top:0,behavior:'smooth'});
}

function setCatFilter(cat) {
  activeCatFilter = cat;
  document.getElementById('mainContent').innerHTML = renderModule(activeModuleId);
}

function doSearch() {
  searchQuery = document.getElementById('searchInput').value;
  activeCatFilter = '全部';
  // Global search: search across all modules and switch to first match
  if (searchQuery.trim()) {
    let foundMod = null;
    for (const modId of moduleOrder) {
      const data = getModuleData(modId);
      const filtered = filterData(modId, data);
      if (filtered.length > 0) {
        foundMod = modId;
        break;
      }
    }
    if (foundMod) {
      activeModuleId = foundMod;
      renderNav();
      document.getElementById('mainContent').innerHTML = renderModule(foundMod);
      return;
    }
  }
  // No match or empty search, refresh current
  document.getElementById('mainContent').innerHTML = renderModule(activeModuleId);
}

document.getElementById('searchInput').addEventListener('keydown', function(e) {
  if (e.key==='Enter') doSearch();
});
document.getElementById('searchInput').addEventListener('input', function() {
  if (!this.value.trim()) {
    searchQuery = '';
    document.getElementById('mainContent').innerHTML = renderModule(activeModuleId);
  }
});

// ==================== DRAG & DROP ====================
let dragSrcIndex = null;

function handleDragStart(e) {
  dragSrcIndex = parseInt(e.target.dataset.index);
  e.target.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', e.target.dataset.moduleId);
}

function handleDragOver(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  e.target.closest('.nav-tab')?.classList.add('drag-over');
}

function handleDragLeave(e) {
  e.target.closest('.nav-tab')?.classList.remove('drag-over');
}

function handleDrop(e) {
  e.preventDefault();
  e.target.closest('.nav-tab')?.classList.remove('drag-over');
  const targetTab = e.target.closest('.nav-tab');
  if (!targetTab || dragSrcIndex === null) return;
  const destIndex = parseInt(targetTab.dataset.index);
  if (destIndex === dragSrcIndex) return;

  // Reorder
  const item = moduleOrder.splice(dragSrcIndex, 1)[0];
  moduleOrder.splice(destIndex, 0, item);
  localStorage.setItem(STORAGE_KEY_MODULES, JSON.stringify(moduleOrder));
  renderNav();
  dragSrcIndex = null;
}

function handleDragEnd(e) {
  e.target.classList.remove('dragging');
  document.querySelectorAll('.nav-tab.drag-over').forEach(t=>t.classList.remove('drag-over'));
  dragSrcIndex = null;
}

// ==================== THEME ====================
function toggleTheme() {
  const body = document.body;
  const cur = body.dataset.theme;
  const next = cur === 'dark' ? 'light' : 'dark';
  body.dataset.theme = next;
  localStorage.setItem(STORAGE_KEY_THEME, next);
}

(function initTheme() {
  const saved = localStorage.getItem(STORAGE_KEY_THEME);
  if (saved) document.body.dataset.theme = saved;
  else if (window.matchMedia('(prefers-color-scheme:dark)').matches) document.body.dataset.theme = 'dark';
})();

// ==================== MODAL ====================
function openAddModal() {
  const sel = document.getElementById('modalModule');
  sel.innerHTML = MODULES.map(m=>`<option value="${m.id}">${m.name}</option>`).join('');
  sel.value = activeModuleId;
  document.getElementById('modalTitle').textContent = '添加工具';
  document.getElementById('modalName').value = '';
  document.getElementById('modalDesc').value = '';
  document.getElementById('modalIcon').value = '🔧';
  document.getElementById('modalUrl').value = '';
  document.getElementById('modalTags').value = '';
  document.getElementById('modalOverlay').classList.add('show');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('show');
}

function confirmAddTool() {
  const name = document.getElementById('modalName').value.trim();
  const desc = document.getElementById('modalDesc').value.trim();
  const icon = document.getElementById('modalIcon').value.trim() || '🔧';
  const url = document.getElementById('modalUrl').value.trim();
  const tags = document.getElementById('modalTags').value.split(',').map(t=>t.trim()).filter(Boolean);
  const modId = document.getElementById('modalModule').value;

  if (!name || !desc || !url) { showToast('请填写名称、简介和网址'); return; }
  if (!/^https?:\/\//i.test(url)) { showToast('网址需以 http:// 或 https:// 开头'); return; }

  const newTool = {
    name, desc, icon, url, tags,
    id: 'user_'+Date.now(),
    _isUser: true
  };

  if (!userTools[modId]) userTools[modId] = [];
  userTools[modId].push(newTool);
  localStorage.setItem(STORAGE_KEY_TOOLS, JSON.stringify(userTools));

  closeModal();
  showToast('✅ 工具已添加！');
  document.getElementById('mainContent').innerHTML = renderModule(activeModuleId);
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2500);
}

// ==================== CARD INTERACTION ====================
function openCardLink(e, url) {
  if (!url || url==='#') return;
  if (e.target.closest('.card-copy-btn')) return; // Don't open link on copy btn click
  window.open(url, '_blank');
}

function copyPrompt(e, btn) {
  e.stopPropagation();
  const raw = btn.dataset.prompt;
  // Unescape HTML entities
  const txt = document.createElement('textarea');
  txt.innerHTML = raw;
  const decoded = txt.value;
  navigator.clipboard.writeText(decoded).then(()=>{
    btn.textContent = '✅ 已复制';
    btn.classList.add('copied');
    setTimeout(()=>{
      btn.textContent = '📋 一键复制';
      btn.classList.remove('copied');
    },2000);
    showToast('📋 已复制到剪贴板');
  }).catch(()=>{
    showToast('复制失败，请手动复制');
  });
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}

// ==================== CLOSE MODAL ON OVERLAY CLICK ====================
document.getElementById('modalOverlay').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

// ==================== INIT ====================
renderNav();
document.getElementById('mainContent').innerHTML = renderModule(activeModuleId);
</script>
